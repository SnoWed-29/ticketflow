user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time';

    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream ticketflow_backend {
        server backend-api:5000;
        keepalive 32;
    }

    upstream ticketflow_keycloak {
        server keycloak:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"ticketflow-nginx"}';
        }

        # Existing root-level backend observability routes.
        location = /health {
            proxy_pass http://ticketflow_backend/health;
        }

        location = /ready {
            proxy_pass http://ticketflow_backend/ready;
        }

        location = /metrics {
            proxy_pass http://ticketflow_backend/metrics;
        }

        # Preserve /api because your Express routes are mounted under /api.
        location /api/ {
            proxy_pass http://ticketflow_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket / Socket.IO traffic.
        location /socket.io/ {
            proxy_pass http://ticketflow_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Keycloak itself is configured with /keycloak as its relative path.
        # Therefore, do not strip /keycloak here.
        location /keycloak/ {
            proxy_pass http://ticketflow_keycloak;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        location = / {
            default_type application/json;
            return 200 '{
                "service": "TicketFlow Gateway",
                "api": "/api",
                "keycloak": "/keycloak",
                "health": "/health",
                "ready": "/ready",
                "metrics": "/metrics"
            }';
        }
    }
}
